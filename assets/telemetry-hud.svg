<svg viewBox="0 0 860 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .frame { fill: #070707; stroke: #1f1f1f; stroke-width: 1.2; }
    .divider { stroke: #1a1a1a; stroke-width: 1; }
    .node { fill: #0c0c0c; stroke: #262626; stroke-width: 1.2; }
    .node-active { fill: #0c0c0c; stroke: #dc2626; stroke-width: 1.2; }
    .title { fill: #FAF9F6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .manifesto { fill: #d4d4d4; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .manifesto-bold { fill: #FAF9F6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; }
    .sub { fill: #888888; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
    .accent { fill: #dc2626; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .wire { stroke: #262626; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .pulse-stream { stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 22 140; fill: none; animation: flow 2.2s linear infinite; }
    .dot { fill: #dc2626; animation: blink 1.5s ease-in-out infinite; }
    @keyframes flow {
      from { stroke-dashoffset: 162; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; r: 3.5px; }
      50% { opacity: 0.25; r: 2px; }
    }
  </style>

  <!-- Outer Obsidian Container -->
  <rect class="frame" x="2" y="2" width="856" height="246" rx="6" />

  <!-- Top Status Bar -->
  <circle class="dot" cx="24" cy="24" r="3.5" />
  <text x="36" y="28" class="title">SYS.MANIFESTO // KEMET LINEAGE</text>
  <text x="728" y="28" class="accent">STATUS: ONLINE</text>
  <line class="divider" x1="2" y1="42" x2="858" y2="42" />

  <!-- Manifesto Body -->
  <text x="24" y="66" class="manifesto-bold">Noise is a vulnerability.</text>
  <text x="24" y="86" class="manifesto">I engineer high-throughput distributed systems and low-latency spatial interfaces.</text>
  <text x="24" y="106" class="manifesto">No frameworks for the sake of frameworks. Zero waterfall latency. Pure execution.</text>

  <line class="divider" x1="2" y1="126" x2="858" y2="126" />

  <!-- Connecting Wires & Animated Crimson Data Packets -->
  <line class="wire" x1="215" y1="186" x2="325" y2="186" />
  <line class="pulse-stream" x1="215" y1="186" x2="325" y2="186" />

  <line class="wire" x1="535" y1="186" x2="645" y2="186" />
  <line class="pulse-stream" x1="535" y1="186" x2="645" y2="186" />

  <!-- Node 1: Next.js 16 Edge Proxy -->
  <rect class="node-active" x="20" y="150" width="195" height="72" rx="4" />
  <text x="34" y="174" class="title">01 // EDGE PROXY</text>
  <text x="34" y="192" class="sub">Next.js 16 + React 19</text>
  <text x="34" y="208" class="accent">Promise.all Fingerprinting</text>

  <!-- Node 2: Upstash Redis Streams -->
  <rect class="node" x="325" y="150" width="210" height="72" rx="4" />
  <text x="339" y="174" class="title">02 // WRITE-BEHIND BUS</text>
  <text x="339" y="192" class="sub">Upstash Redis + SSE Stream</text>
  <text x="339" y="208" class="accent">XADD / XREADGROUP Queue</text>

  <!-- Node 3: Neon Serverless Postgres -->
  <rect class="node" x="645" y="150" width="195" height="72" rx="4" />
  <text x="659" y="174" class="title">03 // PERSISTENCE CORE</text>
  <text x="659" y="192" class="sub">Neon Postgres + Prisma 7</text>
  <text x="659" y="208" class="accent">Pooled Read + Axiom APL</text>
</svg>
