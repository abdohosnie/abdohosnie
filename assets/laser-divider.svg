<svg viewBox="0 0 860 14" width="860" height="14" xmlns="http://www.w3.org/2000/svg">
  <style>
    .track { stroke: #171717; stroke-width: 1.5; }
    .beam {
      stroke: #dc2626;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 120 740;
      animation: sweep 3.2s linear infinite;
    }
    .node { fill: #dc2626; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes sweep {
      from { stroke-dashoffset: 860; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
  </style>
  <line class="track" x1="10" y1="7" x2="850" y2="7" />
  <line class="beam" x1="10" y1="7" x2="850" y2="7" />
  <circle class="node" cx="10" cy="7" r="3" />
  <circle class="node" cx="850" cy="7" r="3" />
</svg>
